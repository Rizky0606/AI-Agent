name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: personal_ai_os
          POSTGRES_USER: personal_ai_os
          POSTGRES_PASSWORD: personal_ai_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_ai_os -d personal_ai_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://personal_ai_os:personal_ai_secret@127.0.0.1:5432/personal_ai_os
      REDIS_URL: redis://127.0.0.1:6379
      MODEL_GATEWAY: mock
      JWT_SECRET: test-jwt-secret-at-least-32-chars-long-abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Suite (Lint, Typecheck, Test, Build)
        run: pnpm test:ci

      - name: Verify Audit Doc References
        run: pnpm verify:audit
