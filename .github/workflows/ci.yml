name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: personal_ai_os
          POSTGRES_USER: personal_ai_os
          POSTGRES_PASSWORD: personal_ai_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personal_ai_os -d personal_ai_os"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://personal_ai_os:personal_ai_secret@127.0.0.1:5432/personal_ai_os
      REDIS_URL: redis://127.0.0.1:6379
      MODEL_GATEWAY: mock
      JWT_SECRET: test-jwt-secret-at-least-32-chars-long-abcdef

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Apply database migrations
        run: sh scripts/migrate-db.sh


      - name: Run CI Suite (Lint, Typecheck, Test, Build)
        run: pnpm test:ci

      - name: Verify Audit Doc References
        run: pnpm verify:audit

  windows-ci:
    name: Windows Hardening & Allowlist CI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Windows Rust Tests (Keystore, Allowlist, PathValidator, Executor)
        run: cargo test --manifest-path apps/windows/src-tauri/Cargo.toml

      - name: Run Windows TypeScript Hardening Tests
        run: pnpm --filter @personal-ai-os/windows test

      - name: Build Windows NSIS Bundle for Smoke Test
        run: pnpm --filter @personal-ai-os/windows tauri build --bundles nsis
        env:
          VITE_SERVER_URL: https://ai.ojixx.my.id

      - name: Run Windows Installer Smoke Test (Install, Run, Verify, Uninstall)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/windows-installer-smoke.ps1
