name: Build installable apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas init --account rizkyf06 --non-interactive
        working-directory: apps/android
      - name: Build Android APK
        working-directory: apps/android
        run: |
          BUILD_JSON="$(eas build --platform android --profile preview --non-interactive --clear-cache --wait --json)"
          BUILD_ID="$(printf '%s' "$BUILD_JSON" | node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => { const value = JSON.parse(s); process.stdout.write(Array.isArray(value) ? value[0].id : value.id); });")"
          test -n "$BUILD_ID"
          DOWNLOAD_LOG="$(eas build:download --build-id "$BUILD_ID" --non-interactive 2>&1)"
          printf '%s\n' "$DOWNLOAD_LOG"
          APK_PATH="$(printf '%s\n' "$DOWNLOAD_LOG" | node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => { const match = s.match(/Build downloaded to (.+\.apk)/); if (!match) process.exit(1); process.stdout.write(match[1].trim()); });")"
          test -f "$APK_PATH"
          cp "$APK_PATH" personal-ai-os.apk
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-os-android-apk
          path: apps/android/personal-ai-os.apk
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @personal-ai-os/windows tauri build --bundles nsis
        env:
          VITE_SERVER_URL: https://ai.ojixx.my.id
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-os-windows-installer
          path: apps/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
