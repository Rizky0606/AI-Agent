name: Build installable apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # `android-actions/setup-android` installs the retired `tools` package, which the
      # cmdline-tools shipped on ubuntu-latest now reject ("Failed to find package 'tools'").
      # The image already ships an SDK, so install only what this build needs.
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_BIN="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin | sort -V | tail -1)"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$CMDLINE_BIN" >> "$GITHUB_PATH"
          yes | "$CMDLINE_BIN/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CMDLINE_BIN/sdkmanager" --install "platform-tools" "build-tools;35.0.0" "platforms;android-35" "ndk;26.1.10909125"
      - run: pnpm install --frozen-lockfile
      - run: npx expo prebuild --platform android --no-install
        working-directory: apps/android
      - name: Build Android APK
        working-directory: apps/android/android
        env:
          EXPO_PUBLIC_API_URL: https://ai.ojixx.my.id
          EXPO_PUBLIC_WS_URL: wss://ai.ojixx.my.id
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
      - run: cp android/app/build/outputs/apk/release/app-release.apk personal-ai-os.apk
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-os-android-apk
          path: apps/android/personal-ai-os.apk
          if-no-files-found: error

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @personal-ai-os/windows tauri build --bundles nsis
        env:
          VITE_SERVER_URL: https://ai.ojixx.my.id
      - uses: actions/upload-artifact@v4
        with:
          name: personal-ai-os-windows-installer
          path: apps/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
