[package]
name = "personal-ai-os-windows"
version = "0.3.0"
description = "Personal AI OS Windows Agent Tauri 2 application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"
tracing = "0.1"
dunce = "1.0"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "sha256", "std"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["std"] }
tauri-plugin-updater = "2.14.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[patch.crates-io]
zip = { git = "https://github.com/zip-rs/zip2.git", tag = "v4.6.1" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
