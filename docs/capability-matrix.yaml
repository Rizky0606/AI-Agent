      - Server Presence Persistence & Audit: `DeviceConnectionManager` enhanced with `DevicePresenceStore` and `DeviceAuditSink`. Fastify API restarts no longer disconnect devices across bounded reconnect grace window (30s). Connect and disconnect events recorded to `audit_logs`.
      - Allowlist & Path Hardening: Closed Alternate Data Stream (ADS) vulnerability by verifying colon placement; blocked UNC paths (`\\server\share`) and device namespaces (`\\.\`, `\\?\`); blocked null bytes (`\0`); blocked URL-encoded traversal (`%2e%2e`); inspected nested script blocks `{ ... }` in PowerShell commands; handled unquoted/quoted command and shell wrappers.
