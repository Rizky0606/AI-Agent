version: 1
updated: 2026-10-13
capabilities:
  control_plane:
    status: implemented
    code: apps/api/src/index.ts; apps/api/src/app.ts
    permission_boundary: authenticated Fastify routes; repository ownership checks
    clients: android; windows
    proof: pnpm --filter @personal-ai-os/api test
  durable_tasks:
    status: implemented
    code: apps/api/src/routes/tasks.ts; apps/api/src/db/task-repository.ts; apps/api/src/services/task-queue.ts
    permission_boundary: task ownership; approval repository
    clients: android task timeline
    limitation: |
      Startup recovery re-enqueues tasks left `running` by a previous process. `createAgentWorker` builds the `BullMqTaskQueue` and returns it as `queue`; `startWorkerProcess` passes it to `recoverInterruptedTasks`, which takes the queue as a required argument so a queue-less call cannot compile. Verified live: worker stopped, task forced to `running`/`progress=40` with its BullMQ job deleted from Redis, worker restarted, log `{"action":"recovery","recoveredCount":1}`, final state `completed`/`progress=100` with events `task.created, task.resumed, task.tool_call, task.completed`. Regression test `apps/agent-worker/test/live-worker-execution.test.ts` ("Startup recovery re-enqueues a dangling task through the worker queue and completes it") hangs and fails if the queue is not wired.
      The e2e "Skenario 4" test in `apps/api/test/e2e-scenarios.test.ts` still does not call `recoverInterruptedTasks` and must not be cited as recovery evidence.
  worker_process:
    status: implemented
    code: apps/agent-worker/src/index.ts
    permission_boundary: SecuredCapabilityGuard; approval repository
    clients: none
    proof: apps/agent-worker/test/worker.test.ts; apps/agent-worker/test/live-worker-execution.test.ts
    limitation: health file is touched on a timer rather than probing database/Redis
  scheduler:
    status: partial
    code: apps/scheduler/src/index.ts; apps/scheduler/src/scheduler-engine.ts
    permission_boundary: PermissionEngine; schedule ownership
    clients: android notifications
    proof: apps/scheduler/test/scheduler.test.ts
    limitation: |
      Live PostgreSQL/Redis process proof is environment-dependent. The API builds `SchedulerEngine` with `SqlScheduleRepository` (`apps/api/src/index.ts:181-183`) but never calls `tick()` there, and the dispatcher only calls `taskQueue.enqueue` without inserting into `tasks` (`:190-191`), so the in-memory Map remains the tick source of truth in the scheduler process. Notifications have never been delivered: `notifications` holds 0 rows in production, `NotificationEngine` is constructed without storage in the API (`apps/api/src/index.ts:209`), `SqlNotificationRepository` is never instantiated, and no production code path bridges task events to notifications. `apps/scheduler/src/fcm-provider.ts:185` injects `accessToken: 'dummy-env-token'` hardcoded, so delivery would fail with 401 even with a valid service account. There is no signature verification on inbound events and `registerRule` is never called in production.
  universal_agent_execution:
    status: implemented
    code: apps/agent-worker/src/task-executor.ts; packages/agent-core/src/router/agent-router.ts
    permission_boundary: executor guard; runtime manager; model:chat guarded by PermissionEngine
    clients: android; windows
    proof: apps/agent-worker/test/live-worker-execution.test.ts; apps/agent-worker/test/worker.test.ts
    limitation: |
      Generic tasks execute one bounded model step per run; planner output is recorded as evidence, not dispatched step-by-step; `payload.mode` is forwarded to the router but only `coding` changes observable behaviour (`selectedRuntimeId`).
      Completion evidence is now independent on the coding, tool, and research paths (2026-10-13). `LocalCodingEnvironment` (`packages/agent-core/src/coding/local-environment.ts`) runs `node --run lint|typecheck|test|build` in a real per-task workspace, and `createDefaultEnvironment()` — which returned `{passed: true}` for every check — is deleted. `executeRegisteredTool` runs `GenericEvaluator` over the tool result before writing `completed` (`apps/agent-worker/src/task-executor.ts:637-674`) and attaches no evidence when a tool returns `null`/`undefined`. `ResearchAgent` no longer carries a hardcoded source or claim list: it searches through `web_search` and browses every hit through `web_fetch` via `LocalResearchEnvironment` (`packages/agent-core/src/research/local-environment.ts`), and a run with no reachable source ends `failed` with `No valid sources provided`. Live proof: a workspace whose `lint` exits 1 ends `failed` with `evaluationResult.score=0.71`; a workspace whose scripts pass ends `completed` with `score=1` and a real git diff artifact; a real research query ends `completed` with `score=1` over five fetched pages (task `46098f3e-…`); a query with no hits ends `failed` with `score=0` (task `c38ae271-…`). Remaining gaps: acceptance criteria are still not persisted before execution, so the tool path evaluates against the default `task_output` criterion and does not check whether the output answers the user's request; and research claims are page openings rather than model synthesis, so relevance to the question is not judged.
  model_gateway:
    status: implemented
    code: packages/model-gateway; apps/api/src/routes/models.ts
    permission_boundary: server-side provider credentials
    clients: android model settings; windows model settings
    proof: apps/api/test/gateway-config.test.ts
  tools:
    status: implemented
    code: packages/tools/src/registry/tool-registry.ts; packages/tools/src/registry/create-default-tool-registry.ts; packages/tools/src/types.ts
    permission_boundary: PermissionEngine; capability guard; bounded outputs
    clients: backend; /v1/catalog
    proof: packages/tools/test; apps/agent-worker/test/live-worker-execution.test.ts
    limitation: the API catalog registers web_fetch and web_search; the worker additionally registers browser_navigate because it owns the Playwright Chromium runner. save_artifact stays unregistered (artifact dependency). web_search now runs a real provider (DuckDuckGo HTML, no API key) and is permission-checked as `web:search`; research consumes it through `LocalResearchEnvironment`.
  browser_mcp:
    status: implemented
    code: packages/mcp/src/hub/mcp-hub.ts; packages/mcp/src/transport/stdio-adapter.ts; packages/mcp/src/config/server-config.ts; apps/agent-worker/src/index.ts
    permission_boundary: PermissionEngine (`tool:mcp_*` is MEDIUM and `external_mcp` scope, so every call needs approval); capability allowlist; untrusted-output sanitizer
    clients: backend (worker)
    proof: packages/mcp/test/stdio-adapter.test.ts; packages/mcp/test/server-config.test.ts; apps/agent-worker/test/mcp-registration.test.ts; packages/permissions/test/permissions.test.ts
    limitation: only a stdio transport exists, so `sse` and `in_process` server configs cannot be launched; servers are declared through the deployment-time `MCP_SERVERS` variable (arbitrary local process execution, never end-user input); every tool of a server shares the single declared capability because MCP has no capability concept of its own; no real third-party MCP server is configured in this deployment
  android:
    status: partial
    code: apps/android/src/screens; apps/android/src/api
    permission_boundary: authenticated API/WebSocket
    clients: android
    proof: pnpm --filter @personal-ai-os/android test
    limitation: attachment upload unavailable; task creation surface is coding-runtime-specific
  windows:
    status: partial
    code: apps/windows/src/ui; apps/windows/src/api; apps/windows/src/connection; apps/windows/src/security; apps/windows/src-tauri
    permission_boundary: authenticated device WSS; local capability registry; server REST calls reuse the same bearer token
    clients: windows
    proof: apps/windows/test/server-api-and-events.test.ts; apps/windows/test/agent-connection.test.ts; pnpm exec tauri build --no-bundle
    limitation: |
      The Tauri release binary builds on Linux aarch64 and was driven under Xvfb against the production API (server tasks, live events, approvals approve/deny, artifact preview, live model catalog); the nsis installer cross-builds on this aarch64 host with cargo-xwin and produces `Personal AI OS - Windows Agent_0.1.0_x64-setup.exe`, unsigned and not yet executed on Windows.
      The device channel is not wired end to end. `dispatchCommand` (`apps/api/src/services/device-connection-manager.ts:154`) has zero callers in `apps/`, so no production path sends a command from a task to a device; the worker only checks `hasOnlineDeviceForUser('windows')` (`apps/agent-worker/src/task-executor.ts:169`). Device identity is not cryptographic: `devices.public_key` (`apps/api/src/db/schema.ts:30`) is never populated or verified, `fetchDeviceIdentity` falls back to the literal `'win-dev-local'` (`apps/windows/src/connection/device-identity.ts:26`), and `deviceId` comes from the `/v1/agent/ws` query string (`apps/api/src/routes/agent-ws.ts:44`). Device sessions live in memory, so an API restart drops every session until devices reconnect. There is no text-command or binary allowlist: enforcement covers capability, action, and `cwd` only. There is also no mapping from Windows capabilities to Personal AI OS capabilities, and `runtimes/{pi,omp,hermes,openhands}-adapter` do not exist in the repository — Hermes and OpenHands are `UnverifiedRuntimeAdapter` only (`packages/agent-core/src/runtimes/unverified-adapter.ts`).
  memory_artifacts_observability:
    status: partial
    code: packages/memory; apps/api/src/db/memory-repository.ts; apps/api/src/routes/memory.ts; apps/api/src/db
    permission_boundary: project/user ownership; audit redaction; artifact quotas
    clients: android artifacts
    proof: packages/memory/test/memory.test.ts; packages/tools/test/artifacts.test.ts
    limitation: |
      Memory is durable as of 2026-10-13. Migration `apps/api/src/db/migrations/0007_memories.sql` creates `memories` with `vector(1536)`, five btree indexes, `type`/`retention` check constraints, and foreign keys to `users`/`projects`; it is applied in production. `DrizzleMemoryRepository` no longer catches query failures and no longer falls back to `InMemoryMemoryStore` — that fallback now exists only for `db === null`, the route unit-test seam — so a missing table surfaces as an error instead of a fake 201. Verified live: `POST /v1/memories` 201, `GET /v1/memories` count=1, `docker compose restart api`, count=1. Regression test: `apps/api/test/memory.test.ts` "database failures are not silently swallowed by an in-memory fallback", confirmed failing when the catch is restored.
      Remaining gaps. Semantic search is inactive and reports so honestly: `POST https://9router.ojixx.my.id/v1/embeddings` returns `{"error":{"message":"No credentials for provider: openai"}}`, so no embedding provider can produce vectors, `InactiveEmbeddingProvider` stays in place, and no ANN index is created because nothing queries one. The `:id` routes validate the path segment as a uuid, so `GET`/`DELETE /v1/memories/search` answer `400` instead of the `500 22P02` the database used to raise; the search contract is `POST /v1/memories/search`. No retention sweeper exists, so expired rows are never deleted (`permanent` is the default and the only value production uses today). There is no automatic memory extraction: `apps/agent-worker` does not import `@personal-ai-os/memory`, so the only write path is `POST /v1/memories`. The unused `artifacts` Drizzle table was deleted from `schema.ts`; real artifacts use `DiskArtifactStorage` plus sidecar metadata.
      Artifacts: checksum sha256 is computed and stored, path traversal is rejected, and quota is enforced cross-process. Gaps: upload is not streaming (JSON string body, effective 1 MiB Fastify `bodyLimit` rather than 25 MB); MIME is client-declared with no magic-byte check; `retention` is a stored field with no sweeper; `accessPolicy: 'project_members'` is ignored; and the quota check-then-put is not atomic (TOCTOU).
      Observability: `audit_logs` in production holds only 10 rows, all approval decisions; tool calls, MCP calls, browser actions, and artifact writes are not recorded. MCP audit goes to `console.log` only. The worker healthcheck touches `/tmp/healthy` on a timer instead of probing database/Redis. Deployment backup/restore and physical client proofs remain environment-dependent.
  deployment:
    status: partial
    code: docker-compose.yml; infrastructure/docker; docs/runbooks/deployment.md
    permission_boundary: private internal network; server secrets
    clients: VPS; windows device channel; android
    proof: docker compose config; https://ai.ojixx.my.id/health, /ready, /metrics; wss://ai.ojixx.my.id/v1/events/ws; /v1/agent/ws handshake
    limitation: live VPS TLS, container limits, runtime-bridge completion, public device WSS and daily pg_dump backups are verified; the restore drill passes against the live backup archive; the nsis installer is cross-built but unsigned and not executed on Windows
