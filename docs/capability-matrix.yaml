      - Hermes Skills Read-Only: Hermes skills (`hermes_telegram_messenger`, `hermes_web_search`, `hermes_browser_automation`, `hermes_memory_recall`, `hermes_script_runner`) are exposed read-only at `GET /v1/skills` and `GET /v1/runtimes/hermes/skills`. Attempts to toggle enable/disable return HTTP 403 Forbidden. Android `SettingsScreen` renders the read-only Hermes skill list in Section 6.
      - Untrusted Output Sanitization: Output from external runtimes is strictly isolated and wrapped in `<untrusted_content is_instruction="false">...</untrusted_content>` before ingestion into artifacts or context.
      - Telegram & Deep Link Safety: Single Telegram instance policy enforced (no second bot). Notifications carry deep links (`personal-ai://tasks/:taskId`, `personal-ai://approvals/:approvalId`). HIGH and CRITICAL approvals strictly require authenticated application JWT sessions and secondary modal confirmation; approvals cannot be made directly from unauthenticated Telegram messages.
      - Remaining gaps: Physical Android device visual rendering and live Hermes VPS network binding require manual runtime verification.
