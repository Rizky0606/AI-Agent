capabilities:
  control_plane:
    status: implemented
    code: apps/api/src/index.ts; apps/api/src/app.ts
    permission_boundary: authenticated Fastify routes; repository ownership checks
    clients: android; windows
    proof: pnpm --filter @personal-ai-os/api test
    limitation: |
      Schema/migration parity is enforced automatically as of 2026-10-14: `apps/api/test/schema-parity.test.ts` creates a scratch database, applies every file in `apps/api/src/db/migrations/` from scratch, introspects the result (`pg_class`/`pg_attribute` with `format_type`), and compares it with every table in `apps/api/src/db/schema.ts` via `getTableConfig` — tables, columns, and column types. The scratch database is dropped afterwards. It runs as part of the API suite (`node --test test/*.test.ts`), which CI invokes after `sh scripts/migrate-db.sh`. The test is proven able to fail in both directions: a `ghost_column` declared only in `schema.ts`, and `audit_logs.resource_id` reverted to `uuid` (the pre-`0010` state), each produce a named mismatch.
  durable_tasks:
    status: implemented
    code: apps/api/src/routes/tasks.ts; apps/api/src/db/task-repository.ts; apps/api/src/services/task-queue.ts
    permission_boundary: task ownership; approval repository
    clients: android task timeline
    limitation: |
      Startup recovery re-enqueues tasks left `running`, `planning`, or orphaned `queued` by a previous process. `createAgentWorker` builds the `BullMqTaskQueue` and returns it as `queue`; `startWorkerProcess` passes it to `recoverInterruptedTasks`.
      Sesi 9 enhancements (ADR 0011):
      1. Bounded retries: if `attempt >= maxAttempts`, the task fails cleanly (`recoveryExhausted: true`) with no infinite re-enqueue loops.
      2. Multi-worker race prevention: atomic lease claim on `tasks.leaseExpiresAt` (`claimTaskForRecovery`) ensures exactly one worker claims and resumes an interrupted task.
      3. Checkpoint integrity gating: checkpoints with tampered/invalid checksums are rejected and failed safely.
      4. Single-command live verification: `pnpm --filter @personal-ai-os/agent-worker test:recovery` (`apps/agent-worker/test/live-recovery-postgres-redis.test.ts`) verifies crash -> restart -> checkpoint resume exactly once against real PostgreSQL and Redis.
