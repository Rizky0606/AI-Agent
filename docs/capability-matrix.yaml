      Windows Layout Redesign and Centralized id-ID Localization implemented (2026-10-15, Sesi 4): Monolithic `App.tsx` (~38 KB) refactored into domain modules under `src/ui/layout/` (`Sidebar.tsx`, `AppHeader.tsx`, `Layout.css`), `src/ui/chat/` (`ChatView.tsx`, `ChatMessages.tsx`, `ChatComposer.tsx`, `EmptyChatState.tsx`, `ToolStepCard.tsx`, `conversation-grouping.ts`), `src/ui/activity/` (`ActivityPanel.tsx`, `ApprovalCard.tsx`, `TaskCard.tsx`, `ArtifactCard.tsx`), `src/ui/project/` (`ProjectView.tsx`), `src/ui/settings/` (`SettingsView.tsx`), and centralized localization `src/ui/locales/id-ID.ts` with 100% consistent Indonesian text (ADR 0006). Zero inline styles remain across all views.
      Left sidebar is collapsible with auto-collapse under 900px viewport, chronologically grouped chats (Hari ini, Kemarin, Lebih lama), new chat button, search input, project allowlist selector, connection status dot, and user profile footer with quick settings and logout.
      Centered chat view is constrained to max-width ~720px with MarkdownMessage formatting, per-message actions (copy, retry, edit), collapsible tool step cards, and 4 Indonesian sample prompts for empty state. Floating pill composer supports Enter send, Shift+Enter newline, Stop button during streaming, and Mode/Model chip slots.
      Right activity drawer organizes Tasks, Approvals, and Artifacts. Real-time toast alerts notify on new pending approvals; approval cards clearly display risk levels and consequences, and HIGH/CRITICAL actions require modal Dialog confirmation (zero window.confirm or raw alert). Project view features interactive tree explorer, diff preview, and Dialog save confirmation. Settings view provides 6 full-page sections: Akun, Perangkat & Izin, Model, Tampilan, Integrasi Sistem, and Lanjutan. Accessible keyboard navigation includes Ctrl+N (new chat) and Ctrl+K (focus search). Usable down to 800x600 minimum window resolution.
      Single-step Google Login implemented (2026-10-15, Sesi 3): 1 user click opens browser via PKCE and state-validated OAuth, exchanges code, registers cryptographic device identity, and establishes WSS connection without requiring a manual "Hubungkan" step. Reopening the app performs zero-click bootstrap (`bootstrapAuth`): valid access tokens or refreshed sessions reconnect seamlessly; revoked tokens (401) wipe the local session and prompt re-login with a clear Indonesian message; offline conditions preserve stored sessions and offer a retry option. Double logins are prevented via `loginInFlight` and `connectingInFlight` single-connection invariants. System tray support (Buka, Status: Aktif, Keluar), configurable close-to-tray (default on), and configurable Windows registry autostart (default off) are integrated natively in Tauri 2 without third-party crates (ADR 0005).
      The Tauri release binary builds on Linux aarch64 and was driven under Xvfb against the production API (server tasks, live events, approvals approve/deny, artifact preview, live model catalog); the nsis installer cross-builds on this aarch64 host with cargo-xwin and produces `Personal AI OS - Windows Agent_0.1.0_x64-setup.exe`, unsigned and not yet executed on Windows.
      The device channel is wired end to end as of 2026-10-13: `TaskExecutor` asks the API for presence (`DeviceDispatcher.listOnlineDevices`) and dispatches through the token-guarded internal route `POST /v1/internal/device-commands` (`apps/api/src/routes/device-commands.ts:43`), because the device sockets only exist in the API process; Caddy answers `404` for `/v1/internal/*`, so the route is reachable only from the internal Docker network. A device command is HIGH risk and is never allowed without approval (`packages/permissions/src/engine.ts:127`), and the approval fingerprint covers the command text and the `deviceId`, so approving one command does not authorise another. The task verdict is the device exit code — no evaluator softens it. Verified live: task `954db21a-…` → `waiting_approval` → approve `200` → the device received `command.execute` → `completed` with `exitCode 0` and an artifact holding the device's real `stdout`; an offline target ends `failed` with `offlineReason: device_unreachable` instead of a false success.
      Remaining gaps. Device identity is cryptographic as of 2026-10-14: the agent signs the server's `device.challenge` with a P-256 private key it stores in webview `localStorage` (`apps/windows/src/connection/device-key.ts`), the server verifies it with `crypto.verify(..., { dsaEncoding: 'ieee-p1363' })` (`apps/api/src/services/device-identity.ts`), and the `deviceId` is the uuid the server issues in `device.handshake_ack` — a `deviceId` in the query string is refused with `DEVICE_IDENTITY_REQUIRED` instead of being trusted. `devices.public_key` holds the canonical JWK and a partial unique index (`devices_public_key_uq`, migration `0008_device_key_identity.sql`) makes one key map to one row, so reinstalling an agent under the same hostname no longer duplicates it. A command allowlist was added 2026-10-14 (`apps/windows/src/security/command-allowlist.ts`): `CommandExecutor` and `TauriCommandExecutor` both call `assertCommandAllowed` before spawning, the permitted programs come from the same local `CapabilityRegistry` rules the capability flags live in (nothing inbound can widen them), and the Rust backend re-checks in `execute_local_command`. Deny by default, with `hostname` plus the programs this repo's own tests exercise; chains (`;`, `&&`, `|`), subshells, `-EncodedCommand`, `Invoke-Expression`/`iex`, shell wrappers (`cmd`, `powershell`, `wscript`, `bash`, `wsl`), the call operator `&`, and path-qualified or extension-qualified program names are all refused with `COMMAND_NOT_ALLOWED` and a named reason. What remains: the private key lives in webview storage rather than an OS keystore (migration to Windows Credential Manager / TPM scheduled for Sesi 15), so compromising the webview compromises that device identity; device sessions still live in memory, so an API restart drops every session until devices reconnect (the registered device row and key survive, and a dispatch now waits `DEVICE_RECONNECT_GRACE_MS` for the agent to dial back instead of failing immediately); and the allowlist has never been exercised on real Windows hardware — only in unit tests.
  memory_artifacts_observability:
    status: partial
    code: packages/memory; apps/api/src/db/memory-repository.ts; apps/api/src/routes/memory.ts; apps/api/src/db
    permission_boundary: project/user ownership; audit redaction; artifact quotas
    clients: android; windows
    proof: packages/memory/test/memory.test.ts; apps/api/test/memory.test.ts; apps/agent-worker/test/task-executor.test.ts; apps/windows/test/layout-and-components.test.ts; pnpm --filter @personal-ai-os/android test
    limitation: |
      Memory subsystem fully upgraded in Sesi 10 (2026-10-15, ADR 0012):
      - Fastify Route Order Fixed: Static routes (`/search`, `/proposals`, `/sweep`, `/backfill`) are declared prior to parameterized `/:id`, completely resolving the 400 error where search was intercepted as an invalid UUID. Both `POST` and `GET /v1/memories/search` return 200.
      - Hybrid Text Search Fallback: 9Router embeddings probe re-verified (`POST /v1/embeddings` returns 401 without provider credentials). Implemented PostgreSQL full-text (`tsvector`/`ts_rank` + `ILIKE`) search on `DrizzleMemoryRepository.searchSemantic` with honest metadata (`semanticSearchActive: false`, `searchMode: 'text_fallback'`). Bounded batch backfill (`backfillEmbeddings`) is available for zero-downtime vector generation when provider credentials are added.
      - Automatic Extraction via Proposals (Zero Silent Storage): `apps/agent-worker` and `apps/api` (chat) invoke `MemoryCandidateExtractor` after conversation or task completion. Candidate memories pass `SensitiveDataFilter` (redacting/rejecting API keys, passwords, NIK, credit cards) and are stored strictly as `status: 'proposed'`. Silent storage is prohibited; users must explicitly approve or edit proposals in the client UI.
      - Retention Sweeper: Automated TTL cleanup (`sweepExpiredMemories` and `POST /v1/memories/sweep`) purges expired rows according to their retention tier (`ephemeral` 1d, `session` 7d, `30d`, `90d`, `permanent` never) and records an audit log to `audit_logs`.
      - ContextManager Provenance: Top-k budgeting is enforced, tracking `usedMemories` and `usedMemoryIds` to provide visibility into which memories shaped an assistant answer.
      - Client UI: Dedicated Memory management screens built for Windows (`MemoryView.tsx`) and Android (`MemoryScreen.tsx`), featuring active memory list, search, edit, delete, global/project scope filter, and proposals approval queue.
      - Remaining gaps: True semantic vector cosine similarity search remains inactive pending 9Router embedding provider credentials.
      Artifacts: checksum sha256 is computed and stored, path traversal is rejected, and quota is enforced cross-process. Uploads stream as of 2026-10-14: `POST /v1/artifacts/stream` takes raw bytes (`application/octet-stream`, custom content-type parser so Fastify never buffers) with a 25 MiB route-scoped `bodyLimit`, pipes them into `storage.putStream` (temp file + `rename`), and `GET /v1/artifacts/:id/download` streams through the previously-unused `getArtifactStream`; the JSON route stays for small clients. MIME is no longer client-declared: `packages/tools/src/artifacts/magic-bytes.ts` sniffs the leading bytes (PNG/JPEG/GIF/WebP/PDF/ZIP, text/JSON fallback) and refuses a mismatch with `InvalidMimeTypeError`. Retention is enforced for artifacts by `apps/api/src/services/artifact-retention-sweeper.ts` on a timer in the API process (`ARTIFACT_RETENTION_SWEEP_INTERVAL_MS`, `ARTIFACT_EPHEMERAL_TTL_MS`): `ephemeral` past its TTL, `task_duration` once its task is terminal, `project_lifetime` once its project is gone, `permanent` never. Remaining gaps: `accessPolicy: 'project_members'` is ignored, the quota check-then-put is not atomic (TOCTOU).
      Observability: `audit_logs` now covers more than approvals (2026-10-14). `SecuredCapabilityGuard` (`packages/permissions/src/guard.ts`) writes one row per call after the outcome is known — `metadata.outcome` (`success`/`failure`) plus `durationMs`/`error` — and both processes pass it an `auditLogger` (API `apps/api/src/index.ts`, worker `apps/agent-worker/src/index.ts`). Artifact writes are audited through `ArtifactManager.auditSink` (`packages/tools/src/artifacts/artifact-manager.ts`), used by API and worker. MCP tool calls go through the same guard (`action: tool:mcp_<server>_<tool>`, `resource_type: external_mcp`), so MCP audit no longer goes to `console.log` only (that sink was deleted). `audit_logs.resource_id` is `varchar(512)` instead of `uuid` (migration `0010_audit_resource_id_text.sql`) because tool calls write paths, URLs, and tool names. A failing audit sink never changes the result the caller sees. Verified live: `audit_logs` holds 38 rows including `web:fetch`/`web:search` (tool calls), `tool:mcp_echo_echo` (MCP call), `browser:navigate` (browser action), and `artifact:write`; the SSRF fetch to `169.254.169.254` is recorded as `allow | failure` with its real error. The worker health file is no longer touched blindly: `refreshHealthFile` probes Postgres (`select 1`) and Redis (`PING`) first and leaves the file stale on failure (see `worker_process` above). Remaining gaps: no alerting and no distributed tracing; deployment backup/restore and physical client proofs remain environment-dependent.
