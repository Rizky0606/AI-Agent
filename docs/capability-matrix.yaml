      The device channel is wired end to end as of 2026-10-13: `TaskExecutor` asks the API for presence (`DeviceDispatcher.listOnlineDevices`) and dispatches through the token-guarded internal route `POST /v1/internal/device-commands` (`apps/api/src/routes/device-commands.ts:43`), because the device sockets only exist in the API process; Caddy answers `404` for `/v1/internal/*`, so the route is reachable only from the internal Docker network. A device command is HIGH risk and is never allowed without approval (`packages/permissions/src/engine.ts:127`), and the approval fingerprint covers the command text and the `deviceId`, so approving one command does not authorise another. The task verdict is the device exit code — no evaluator softens it. Verified live: task `954db21a-…` → `waiting_approval` → approve `200` → the device received `command.execute` → `completed` with `exitCode 0` and an artifact holding the device's real `stdout`; an offline target ends `failed` with `offlineReason: device_unreachable` instead of a false success.
      Windows Hardening completed in Sesi 15 (2026-10-16, ADR 0016):
