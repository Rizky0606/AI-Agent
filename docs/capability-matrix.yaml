    limitation: |
      Client Model Selector implemented (2026-10-15, Sesi 6, ADR 0008): Free-text model input removed from composer. Chip Model opens accessible Popover with real-time search, provider grouping, 'Auto (Disarankan)' pinned at top, verified capability badges (Stream, Tools, Vision, Context size, Latency) only when proven by backend probe, 'Unknown' badge for unproven capabilities, favorite toggling (★), and 'Jadikan Default Akun' action.
