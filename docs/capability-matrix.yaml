    limitation: |
      Memory subsystem fully upgraded in Sesi 10 (2026-10-15, ADR 0012):
      - Fastify Route Order Fixed: Static routes (`/search`, `/proposals`, `/sweep`, `/backfill`) are declared prior to parameterized `/:id`, completely resolving the 400 error where search was intercepted as an invalid UUID. Both `POST` and `GET /v1/memories/search` return 200.
      - Hybrid Text Search Fallback: 9Router embeddings probe re-verified (`POST /v1/embeddings` returns 401 without provider credentials). Implemented PostgreSQL full-text (`tsvector`/`ts_rank` + `ILIKE`) search on `DrizzleMemoryRepository.searchSemantic` with honest metadata (`semanticSearchActive: false`, `searchMode: 'text_fallback'`). Bounded batch backfill (`backfillEmbeddings`) is available for zero-downtime vector generation when provider credentials are added.
      - Automatic Extraction via Proposals (Zero Silent Storage): `apps/agent-worker` and `apps/api` (chat) invoke `MemoryCandidateExtractor` after conversation or task completion. Candidate memories pass `SensitiveDataFilter` (redacting/rejecting API keys, passwords, NIK, credit cards) and are stored strictly as `status: 'proposed'`. Silent storage is prohibited; users must explicitly approve or edit proposals in the client UI.
      - Retention Sweeper: Automated TTL cleanup (`sweepExpiredMemories` and `POST /v1/memories/sweep`) purges expired rows according to their retention tier (`ephemeral` 1d, `session` 7d, `30d`, `90d`, `permanent` never) and records an audit log to `audit_logs`.
      - ContextManager Provenance: Top-k budgeting is enforced, tracking `usedMemories` and `usedMemoryIds` to provide visibility into which memories shaped an assistant answer.
      - Client UI: Dedicated Memory management screens built for Windows (`MemoryView.tsx`) and Android (`MemoryScreen.tsx`), featuring active memory list, search, edit, delete, global/project scope filter, and proposals approval queue.
      - Remaining gaps: True semantic vector cosine similarity search remains inactive pending 9Router embedding provider credentials.
      Artifacts: checksum sha256 is computed and stored, path traversal is rejected, and quota is enforced cross-process. Uploads stream as of 2026-10-14: `POST /v1/artifacts/stream` takes raw bytes (`application/octet-stream`, custom content-type parser so Fastify never buffers) with a 25 MiB route-scoped `bodyLimit`, pipes them into `storage.putStream` (temp file + `rename`), and `GET /v1/artifacts/:id/download` streams through the previously-unused `getArtifactStream`; the JSON route stays for small clients. MIME is no longer client-declared: `packages/tools/src/artifacts/magic-bytes.ts` sniffs the leading bytes (PNG/JPEG/GIF/WebP/PDF/ZIP, text/JSON fallback) and refuses a mismatch with `InvalidMimeTypeError`. Retention is enforced for artifacts by `apps/api/src/services/artifact-retention-sweeper.ts` on a timer in the API process (`ARTIFACT_RETENTION_SWEEP_INTERVAL_MS`, `ARTIFACT_EPHEMERAL_TTL_MS`): `ephemeral` past its TTL, `task_duration` once its task is terminal, `project_lifetime` once its project is gone, `permanent` never. Remaining gaps: `accessPolicy: 'project_members'` is ignored, the quota check-then-put is not atomic (TOCTOU).
      Observability, Alerting, & Offsite Backup upgraded in Sesi 16 & Sesi 19 (ADR 0018, ADR 0021):
      - Alerting: `VpsAlertChecker` monitors /ready, BullMQ queue health, backup freshness (<26h), disk usage (<85%), and TLS certificate expiration (<14d), dispatching Indonesian alerts to Telegram via `TelegramAlertTransport` with cooldown suppression (ADR 0018).
      - Distributed Tracing & W3C Propagation: `TelemetryTracer` enhanced with W3C `traceparent` propagation across Client -> Fastify API -> BullMQ queue -> Worker execution -> Model call. Low-sampling (default 10%) saves ARM64 resources while 100% of error spans are captured. Strict redaction (`redactSensitiveAttributes`) purges passwords, tokens, API keys, and Authorization headers.
      - Authenticated Offsite Backup (Sesi 19, ADR 0021): `scripts/backup-offsite.sh`, `scripts/restore-offsite.sh`, and `scripts/backup-crypto.js` implement authenticated AES-256-GCM encryption with Scrypt KDF and strict 0600 file permission enforcement (passphrase via command-line arguments strictly forbidden). Unencrypted raw dumps are purged immediately after encryption and upload. S3 upload failure or missing encryption key fails hard with non-zero exit code. Verified with automated end-to-end tests (`apps/api/test/offsite-backup-restore.test.ts`).
      - Edge Hardening: Added security headers (HSTS, nosniff, DENY, Referrer-Policy, Permissions-Policy) and access log rotation to `infrastructure/caddy/Caddyfile` and Fastify hooks.
      - Capacity Profile: Benchmarked 10 parallel chats + 1 Chromium task + 1 OMP run; established memory and concurrency limits in `docs/runbooks/resource-profiling-and-capacity.md`.
      - Remaining gaps: Live Telegram message delivery and offsite S3 cloud bucket push depend on production secret provisioning. Live restore drill to Oracle Cloud Object Storage is marked "Belum diverifikasi (menunggu kredensial Oracle Object Storage dari pemilik)".
