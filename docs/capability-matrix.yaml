  windows:
    status: partial
    code: apps/windows/src/ui; apps/windows/src/api; apps/windows/src/connection; apps/windows/src/security; apps/windows/src-tauri
    permission_boundary: authenticated device WSS; local capability registry; server REST calls reuse the same bearer token
    clients: windows
    proof: apps/windows/test/server-api-and-events.test.ts; apps/windows/test/agent-connection.test.ts; apps/windows/test/connection-and-offline.test.ts; apps/api/test/device-handshake.test.ts; apps/api/test/device-commands.test.ts; apps/agent-worker/test/device-dispatch.test.ts; pnpm exec tauri build --no-bundle
    limitation: |
      The Tauri release binary builds on Linux aarch64 and was driven under Xvfb against the production API (server tasks, live events, approvals approve/deny, artifact preview, live model catalog); the nsis installer cross-builds on this aarch64 host with cargo-xwin and produces `Personal AI OS - Windows Agent_0.1.0_x64-setup.exe`, unsigned and not yet executed on Windows.
      The device channel is wired end to end as of 2026-10-13: `TaskExecutor` asks the API for presence (`DeviceDispatcher.listOnlineDevices`) and dispatches through the token-guarded internal route `POST /v1/internal/device-commands` (`apps/api/src/routes/device-commands.ts:43`), because the device sockets only exist in the API process; Caddy answers `404` for `/v1/internal/*`, so the route is reachable only from the internal Docker network. A device command is HIGH risk and is never allowed without approval (`packages/permissions/src/engine.ts:127`), and the approval fingerprint covers the command text and the `deviceId`, so approving one command does not authorise another. The task verdict is the device exit code — no evaluator softens it. Verified live: task `954db21a-…` → `waiting_approval` → approve `200` → the device received `command.execute` → `completed` with `exitCode 0` and an artifact holding the device's real `stdout`; an offline target ends `failed` with `offlineReason: device_unreachable` instead of a false success.
      Remaining gaps. Device identity is cryptographic as of 2026-10-14: the agent signs the server's `device.challenge` with a P-256 private key it stores in webview `localStorage` (`apps/windows/src/connection/device-key.ts`), the server verifies it with `crypto.verify(..., { dsaEncoding: 'ieee-p1363' })` (`apps/api/src/services/device-identity.ts`), and the `deviceId` is the uuid the server issues in `device.handshake_ack` — a `deviceId` in the query string is refused with `DEVICE_IDENTITY_REQUIRED` instead of being trusted. `devices.public_key` holds the canonical JWK and a partial unique index (`devices_public_key_uq`, migration `0008_device_key_identity.sql`) makes one key map to one row, so reinstalling an agent under the same hostname no longer duplicates it. What remains: the private key lives in webview storage rather than an OS keystore, so compromising the webview compromises that device identity; device sessions still live in memory, so an API restart drops every session until devices reconnect (the registered row and key survive); and there is no text-command or binary allowlist — enforcement covers capability, action, and `cwd` only, so any PowerShell command runs inside an allowed working directory once a capability is enabled.
  memory_artifacts_observability:
    status: partial
    code: packages/memory; apps/api/src/db/memory-repository.ts; apps/api/src/routes/memory.ts; apps/api/src/db
    permission_boundary: project/user ownership; audit redaction; artifact quotas
    clients: android artifacts
    proof: packages/memory/test/memory.test.ts; packages/tools/test/artifacts.test.ts
    limitation: |
      Memory is durable as of 2026-10-13. Migration `apps/api/src/db/migrations/0007_memories.sql` creates `memories` with `vector(1536)`, five btree indexes, `type`/`retention` check constraints, and foreign keys to `users`/`projects`; it is applied in production. `DrizzleMemoryRepository` no longer catches query failures and no longer falls back to `InMemoryMemoryStore` — that fallback now exists only for `db === null`, the route unit-test seam — so a missing table surfaces as an error instead of a fake 201. Verified live: `POST /v1/memories` 201, `GET /v1/memories` count=1, `docker compose restart api`, count=1. Regression test: `apps/api/test/memory.test.ts` "database failures are not silently swallowed by an in-memory fallback", confirmed failing when the catch is restored.
      Remaining gaps. Semantic search is inactive and reports so honestly: `POST https://9router.ojixx.my.id/v1/embeddings` returns `{"error":{"message":"No credentials for provider: openai"}}`, so no embedding provider can produce vectors, `InactiveEmbeddingProvider` stays in place, and no ANN index is created because nothing queries one. The `:id` routes validate the path segment as a uuid, so `GET`/`DELETE /v1/memories/search` answer `400` instead of the `500 22P02` the database used to raise; the search contract is `POST /v1/memories/search`. No retention sweeper exists, so expired rows are never deleted (`permanent` is the default and the only value production uses today). There is no automatic memory extraction: `apps/agent-worker` does not import `@personal-ai-os/memory`, so the only write path is `POST /v1/memories`. The unused `artifacts` Drizzle table was deleted from `schema.ts`; real artifacts use `DiskArtifactStorage` plus sidecar metadata.
      Artifacts: checksum sha256 is computed and stored, path traversal is rejected, and quota is enforced cross-process. Gaps: upload is not streaming (JSON string body, effective 1 MiB Fastify `bodyLimit` rather than 25 MB); MIME is client-declared with no magic-byte check; `retention` is a stored field with no sweeper; `accessPolicy: 'project_members'` is ignored; and the quota check-then-put is not atomic (TOCTOU).
      Observability: `audit_logs` now covers more than approvals (2026-10-14). `SecuredCapabilityGuard` (`packages/permissions/src/guard.ts`) writes one row per call after the outcome is known — `metadata.outcome` (`success`/`failure`) plus `durationMs`/`error` — and both processes pass it an `auditLogger` (API `apps/api/src/index.ts`, worker `apps/agent-worker/src/index.ts`). Artifact writes are audited through `ArtifactManager.auditSink` (`packages/tools/src/artifacts/artifact-manager.ts`), used by API and worker. MCP tool calls go through the same guard (`action: tool:mcp_<server>_<tool>`, `resource_type: external_mcp`), so MCP audit no longer goes to `console.log` only (that sink was deleted). `audit_logs.resource_id` is `varchar(512)` instead of `uuid` (migration `0010_audit_resource_id_text.sql`) because tool calls write paths, URLs, and tool names. A failing audit sink never changes the result the caller sees. Verified live: `audit_logs` holds 38 rows including `web:fetch`/`web:search` (tool calls), `tool:mcp_echo_echo` (MCP call), `browser:navigate` (browser action), and `artifact:write`; the SSRF fetch to `169.254.169.254` is recorded as `allow | failure` with its real error. Remaining gaps: the worker healthcheck still touches `/tmp/healthy` on a timer instead of probing database/Redis, and there is no alerting or distributed tracing. Deployment backup/restore and physical client proofs remain environment-dependent.
