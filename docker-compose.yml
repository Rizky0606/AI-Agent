services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend, edge]
    expose: ['3000']
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 768M }
    mem_limit: 768m
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 1536M }
    mem_limit: 1536m
    restart: unless-stopped
  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.scheduler
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 512M }
    mem_limit: 512m
    restart: unless-stopped
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_ai_os}
      POSTGRES_USER: ${POSTGRES_USER:-personal_ai_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    networks: [backend]
    expose: ['5432']
    healthcheck:
      {
        test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'],
        interval: 10s,
        timeout: 5s,
        retries: 5,
      }
    deploy:
      resources:
        limits: { cpus: '0.75', memory: 2G }
    mem_limit: 2g
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    networks: [backend]
    expose: ['6379']
    healthcheck: { test: ['CMD', 'redis-cli', 'ping'], interval: 10s, timeout: 5s, retries: 5 }
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 512M }
    mem_limit: 512m
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment: [ACME_EMAIL, PUBLIC_HOSTNAME]
    ports: ['80:80', '443:443']
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [api]
    deploy:
      resources:
        limits: { cpus: '0.25', memory: 256M }
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  backend:
    internal: true
  edge: {}
